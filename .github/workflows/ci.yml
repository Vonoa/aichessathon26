name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: make gate

  harness:
    # Windows only: it is the platform we develop on and the one that surfaces path
    # and line-ending problems. macOS runners bill at 10x private-repo minutes and
    # Linux is already covered by `gate`, so neither earns its place here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run python -m harness.arena --opponent baselines/random --games 2 --base-ms 5000
