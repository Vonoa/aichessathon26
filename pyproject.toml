[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# versions/ holds frozen arena opponents and the offline phase-7 training pipeline --
# archival / experimental code, not the gated engine. Don't lint it.
extend-exclude = ["versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "search", "evaluate"]

[tool.mypy]
strict = true
files = ["agent.py", "search.py", "evaluate.py", "movegen.py"]  # harness/ is upstream's and now has OS-specific code

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]  # numba ships no type stubs
ignore_missing_imports = true
